name: Build & Deploy to Proxmox VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality-checks:
    name: Run Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install system dependencies (ffmpeg & yt-dlp)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Run tests
        run: pnpm run test:run

      - name: Run TypeScript type check
        run: pnpm run type-check

      - name: Run Biome linter check
        run: pnpm run lint

      - name: Run Biome formatting check
        run: pnpm run format:check

  build-and-push:
    name: Build & Push Docker Image to GHCR
    needs: quality-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Proxmox VM
    needs: build-and-push
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROXMOX_VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.PROXMOX_SSH_PORT || 22 }} -H "${{ secrets.PROXMOX_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync deployment files to Proxmox VM
        env:
          SSH_USER: ${{ secrets.PROXMOX_USER }}
          SSH_HOST: ${{ secrets.PROXMOX_HOST }}
          SSH_PORT: ${{ secrets.PROXMOX_SSH_PORT || 22 }}
          TARGET_DIR: ${{ secrets.PROXMOX_DEPLOY_PATH || '/opt/video-analyzer' }}
          PROD_ENV: ${{ secrets.PROD_ENV }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "mkdir -p $TARGET_DIR"
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" -o StrictHostKeyChecking=no docker-compose.prod.yml "$SSH_USER@$SSH_HOST:$TARGET_DIR/docker-compose.yml"

          # Inyectar el .env completo directamente desde el secret
          printf "%s\n" "$PROD_ENV" | ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "cat > $TARGET_DIR/.env && chmod 600 $TARGET_DIR/.env"

      - name: Execute remote deployment commands
        env:
          SSH_USER: ${{ secrets.PROXMOX_USER }}
          SSH_HOST: ${{ secrets.PROXMOX_HOST }}
          SSH_PORT: ${{ secrets.PROXMOX_SSH_PORT || 22 }}
          TARGET_DIR: ${{ secrets.PROXMOX_DEPLOY_PATH || '/opt/video-analyzer' }}
          IMAGE_TAG: ${{ github.sha }}
          REGISTRY_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.DEPLOY_GHCR_PAT || secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            bash -s "$TARGET_DIR" "$REGISTRY_IMAGE" "$IMAGE_TAG" "$GHCR_USER" "$GHCR_TOKEN" << 'EOF'
            set -euo pipefail
            TARGET_DIR="$1"
            REGISTRY_IMAGE="$2"
            IMAGE_TAG="$3"
            GHCR_USER="$4"
            GHCR_TOKEN="$5"

            cd "$TARGET_DIR"

            if [ -n "$GHCR_TOKEN" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi

            export REGISTRY_IMAGE="$REGISTRY_IMAGE"
            export IMAGE_TAG="$IMAGE_TAG"

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
          EOF

      - name: Clean up local SSH key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
